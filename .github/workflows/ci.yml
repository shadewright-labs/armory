name: CI

# Keep this workflow unfiltered so ci-ok reports a result on every pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each Go step skips until the first package lands with go.mod.
      - name: Set up Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        if: ${{ hashFiles('go.mod') != '' }}
        run: go build ./...

      - name: Vet
        if: ${{ hashFiles('go.mod') != '' }}
        run: go vet ./...

      - name: Test with the race detector
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test -race ./...

      - name: Run golangci-lint
        if: ${{ hashFiles('go.mod') != '' }}
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "${GOBIN}/golangci-lint" run ./...

      - name: Run govulncheck
        if: ${{ hashFiles('go.mod') != '' }}
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "${GOBIN}/govulncheck" ./...

  codeql:
    # CodeQL has its own push, scheduled and manual triggers.
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  workflow-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [go, codeql, workflow-lint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "${NEEDS}" | jq -e '
            [.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null
