name: CI

# Keep this workflow unfiltered so ci-ok reports a result on every pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # "true" when the test step wrote coverage.out; the coverage job reads it.
      profile: ${{ steps.profile.outputs.present }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each Go step skips until the first package lands with go.mod.
      - name: Set up Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        if: ${{ hashFiles('go.mod') != '' }}
        run: go build ./...

      - name: Vet
        if: ${{ hashFiles('go.mod') != '' }}
        run: go vet ./...

      - name: Test with the race detector
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Note whether a coverage profile exists
        id: profile
        run: |
          if [ -f coverage.out ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      # The coverage job uploads this file; it gets nothing else from this job.
      - name: Upload coverage profile
        if: ${{ steps.profile.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      - name: Run golangci-lint
        if: ${{ hashFiles('go.mod') != '' }}
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "${GOBIN}/golangci-lint" run ./...

      - name: Run govulncheck
        if: ${{ hashFiles('go.mod') != '' }}
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "${GOBIN}/govulncheck" ./...

  # The upload has its own job because the Codecov action downloads the uploader at run time. Here it runs away
  # from the Go job and gets nothing but the coverage file and the upload token. It passes without uploading when
  # there is no go.mod (no profile), or no token (fork and Dependabot pull requests get none).
  coverage:
    name: Coverage upload
    needs: go
    if: ${{ needs.go.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      HAS_PROFILE: ${{ needs.go.outputs.profile }}
    steps:
      - name: Nothing to upload
        if: env.CODECOV_TOKEN == '' || env.HAS_PROFILE != 'true'
        run: echo "no token or no coverage profile, nothing uploaded"

      - name: Check out the repository
        if: env.CODECOV_TOKEN != '' && env.HAS_PROFILE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the coverage profile
        if: env.CODECOV_TOKEN != '' && env.HAS_PROFILE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # version pins the uploader the action downloads, so a run does not take whatever is latest.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != '' && env.HAS_PROFILE == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: shadewright-labs/armory
          files: coverage.out
          disable_search: true
          fail_ci_if_error: false
          version: v11.3.2
          disable_telem: true

  codeql:
    # CodeQL has its own push, scheduled and manual triggers.
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  workflow-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [go, coverage, codeql, workflow-lint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "${NEEDS}" | jq -e '
            [.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null
