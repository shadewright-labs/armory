name: CodeQL

# CodeQL code scanning (advanced setup) for Go and for the workflows themselves (language `actions`). It runs on
# pushes to main, weekly and by hand, and is called by ci.yml on pull requests that change Go code or workflows
# (group `codeql` of hack/ci-changed.sh). The caller grants contents: read and security-events: write. Results appear in the Security tab. Code scanning default setup must
# stay off: GitHub refuses uploads from an advanced configuration while default setup is on.
#
# Go uses `build-mode: autobuild`, after setup-go with the Go release of go.mod: the module has no cgo, so
# autobuild finds it and builds it. `actions` needs no build (build-mode none).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  GOFLAGS: -mod=readonly
  GOWORK: off

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the results
      contents: read
      # No actions: read: CodeQL needs it only to read workflow run metadata in private repositories.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # results are uploaded with a token that can write security events: no cache to poison

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Go module
        if: ${{ matrix.build-mode == 'autobuild' }}
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
