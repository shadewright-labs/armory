name: IANA registries

# Compares the three IANA registries that the netguard table follows (ADR-0004) with the copies pinned under
# netguard/testdata/iana, weekly and by hand. The package makes no network call; only this job does. A
# difference fails the compare job and opens one issue per changed registry with the changed rows in a fenced
# block, or comments on the open issue for that registry. The compare job has no write permission; the report
# job has only issues: write and reads the rows from an artifact, never from the workflow text.
on:
  schedule:
    - cron: "41 5 * * 3" # Wednesdays 05:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  compare:
    name: compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and compare
        id: compare
        env:
          MAX_BYTES: "262144"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/iana" "${RUNNER_TEMP}/diff"
          changed=false
          for path in \
            iana-ipv4-special-registry/iana-ipv4-special-registry-1.csv \
            iana-ipv6-special-registry/iana-ipv6-special-registry-1.csv \
            ipv6-unicast-address-assignments/ipv6-unicast-address-assignments.csv; do
            name="${path##*/}"
            out="${RUNNER_TEMP}/iana/${name}"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --retry 3 --retry-delay 10 --max-time 60 --max-filesize "${MAX_BYTES}" \
              --output "${out}" "https://www.iana.org/assignments/${path}"
            size="$(wc -c < "${out}")"
            if [ "${size}" -gt "${MAX_BYTES}" ] || [ "${size}" -eq 0 ]; then
              echo "::error::${name}: unexpected size ${size}"
              exit 1
            fi
            if ! cmp -s "netguard/testdata/iana/${name}" "${out}"; then
              changed=true
              echo "::warning::${name} differs from the pinned copy"
              # Changed rows only, at most 200 lines of 300 characters each.
              { diff -u "netguard/testdata/iana/${name}" "${out}" || true; } \
                | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | head -n 200 | cut -c1-300 \
                > "${RUNNER_TEMP}/diff/${name}.txt" || true
            fi
          done
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Keep the changed rows
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iana-diff
          path: ${{ runner.temp }}/diff
          retention-days: 30
          if-no-files-found: error

      - name: Fail on a difference
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "::error::An IANA registry differs from the pinned copy under netguard/testdata/iana. See ADR-0004, How the table is kept current."
          exit 1

  report:
    name: report
    needs: compare
    if: ${{ always() && needs.compare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Fetch the changed rows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iana-diff
          path: ${{ runner.temp }}/diff

      - name: Open or update one issue per registry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for file in "${RUNNER_TEMP}"/diff/*.txt; do
            name="$(basename "${file}" .txt)"
            case "${name}" in
              iana-ipv4-special-registry-1.csv|iana-ipv6-special-registry-1.csv|ipv6-unicast-address-assignments.csv) ;;
              *) echo "::error::unexpected file"; exit 1 ;;
            esac
            title="netguard: IANA registry changed: ${name}"
            body="${RUNNER_TEMP}/body.md"
            rows="${RUNNER_TEMP}/rows.txt"
            {
              echo "The weekly check found that \`${name}\` differs from the copy pinned under \`netguard/testdata/iana\`."
              echo "Update the pinned copy, \`DATES\`, the constants and \`netguard/table.go\` as ADR-0004 describes."
              echo
              echo "Run: ${RUN_URL}"
              echo
              echo "Changed rows (\`-\` pinned, \`+\` current):"
              echo
              echo '~~~~text'
            } > "${body}"
            # Break every run of four tildes, repeating until none is left, so no row can close the fence.
            tr -d '\r' < "${file}" | LC_ALL=C sed -e ':a' -e 's/~~~~/~ ~ ~ ~/' -e 'ta' > "${rows}"
            # The escaping makes rows longer, so bound the whole body: GitHub takes at most 65536 characters, and
            # counting bytes (never fewer than characters) with a margin keeps it under that. Room is kept for the
            # closing fence and the truncation notice; a cut row is dropped whole.
            limit=65000
            fence='~~~~'
            notice="The rows were truncated to fit the issue body limit. The iana-diff artifact of the run holds all of them."
            if [ $(( $(wc -c < "${body}") + $(wc -c < "${rows}") + ${#fence} + 1 )) -le "${limit}" ]; then
              { cat "${rows}"; echo "${fence}"; } >> "${body}"
            else
              room=$(( limit - $(wc -c < "${body}") - ${#fence} - ${#notice} - 3 ))
              { LC_ALL=C head -c "${room}" "${rows}" | LC_ALL=C sed '$d'; echo "${fence}"; echo; echo "${notice}"; } >> "${body}"
            fi
            existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
              --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body-file "${body}"
            else
              gh issue create --title "${title}" --body-file "${body}"
            fi
          done
