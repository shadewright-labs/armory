name: Vulncheck

# govulncheck (pinned below) over the module, with the Go release of go.mod. Fails on any known vulnerability the
# code reaches. Called by ci.yml on pull requests and pushes to main, which decides from the changed files
# whether it runs.
# A scheduled run always runs, and so does a manual run; a call from ci.yml runs unless it passes run: false.
# `inputs.run` is empty on a scheduled run, and an empty value compares equal to false, so the event names are
# tested first and the input only for a call.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the job runs; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true
  # New advisories can affect an unchanged main, so scan weekly too (Monday 06:17 UTC).
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      run:
        description: Run govulncheck.
        type: boolean
        default: true

permissions: {}

env:
  GOFLAGS: -mod=readonly
  GOWORK: off

jobs:
  vulncheck:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.run != false }}
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: local
          GOBIN: ${{ runner.temp }}/go-tools
          GOVULNCHECK_VERSION: v1.9.0
        run: |
          set -euo pipefail
          GOFLAGS='' go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "${GOBIN}/govulncheck" ./...
