name: Repo checks

# Checks that run on every pull request whatever changed, because they are cheap and a change anywhere can break
# them: the internal links of the tracked Markdown files (a renamed package can break a docs link) and the
# offline tests of the scripts under hack/ that CI relies on. Go is set up for the fuzz target list, which asks
# the go command. The secret scan controls (hack/test/gitleaks_test.sh) run in secret-scan.yml.
# Called by ci.yml (the only trigger); always runs.
on:
  workflow_call:

permissions: {}

jobs:
  repo-checks:
    name: repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check internal links
        run: python3 -I hack/docs-links.py check

      - name: Test the changed-files detector
        run: hack/test/ci-changed_test.sh

      - name: Test the ci-ok predicate
        run: hack/test/ci-ok_test.sh

      - name: Test the fuzz target list
        run: hack/test/fuzz-targets_test.sh

      - name: Test the link checker
        run: hack/test/docs-links_test.sh

      - name: Test the workflows' structure
        run: hack/test/workflows_test.sh
