<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" width="1920" height="760" aria-hidden="true">
  <defs>
    <radialGradient id="cluster-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B3DFF" stop-opacity="0.06"/>
      <stop offset="68%" stop-color="#8B3DFF" stop-opacity="0.018"/>
      <stop offset="100%" stop-color="#8B3DFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .cluster-aura { fill: url(#cluster-glow); }
      .edge-i { stroke: #EFE6D2; stroke-opacity: 0.16; stroke-width: 0.9; }
      .edge-v { stroke: #B794FF; stroke-opacity: 0.22; stroke-width: 0.95; }
      .bridge { stroke: #EFE6D2; stroke-opacity: 0.11; stroke-width: 0.85; stroke-dasharray: 3 5; }
      .bridge-sky { stroke: #EFE6D2; stroke-opacity: 0.085; stroke-width: 0.8; stroke-dasharray: 2 6; }
      .dot-i { fill: #EFE6D2; fill-opacity: 0.62; }
      .dot-v { fill: #B794FF; fill-opacity: 0.72; }
      .halo-i { fill: #EFE6D2; fill-opacity: 0.11; }
      .halo-v { fill: #8B3DFF; fill-opacity: 0.20; }
      .dot-sky-i { fill: #EFE6D2; fill-opacity: 0.46; }
      .dot-sky-v { fill: #B794FF; fill-opacity: 0.52; }
      .halo-sky-i { fill: #EFE6D2; fill-opacity: 0.08; }
      .halo-sky-v { fill: #8B3DFF; fill-opacity: 0.12; }

      .p1-dot { animation: arm-pulse 21s ease-in-out -4s infinite; }
      .p1-halo { animation: arm-halo 21s ease-in-out -4s infinite; }
      .p2-dot { animation: arm-pulse 25s ease-in-out -10s infinite; }
      .p2-halo { animation: arm-halo 25s ease-in-out -10s infinite; }
      .p3-dot { animation: arm-pulse 23s ease-in-out -15s infinite; }
      .p3-halo { animation: arm-halo 23s ease-in-out -15s infinite; }
      .p4-dot { animation: arm-pulse 27s ease-in-out -7s infinite; }
      .p4-halo { animation: arm-halo 27s ease-in-out -7s infinite; }
      .p5-dot { animation: arm-pulse 22s ease-in-out -16s infinite; }
      .p5-halo { animation: arm-halo 22s ease-in-out -16s infinite; }
      .p6-dot { animation: arm-pulse 29s ease-in-out -12s infinite; }
      .p6-halo { animation: arm-halo 29s ease-in-out -12s infinite; }

      /* Single accent star: brightens slowly from ivory to violet and back over 26s. */
      .accent-ivory-halo { fill: #EFE6D2; opacity: 0.14; animation: arm-accent-ivory-halo 26s ease-in-out -11s infinite; }
      .accent-ivory-dot { fill: #EFE6D2; opacity: 0.70; animation: arm-accent-ivory 26s ease-in-out -11s infinite; }
      .accent-violet-ring { fill: none; stroke: #B794FF; stroke-width: 1.1; opacity: 0; animation: arm-accent-ring 26s ease-out -11s infinite; }
      .accent-violet-halo { fill: #8B3DFF; opacity: 0; animation: arm-accent-violet-halo 26s ease-in-out -11s infinite; }
      .accent-violet-dot { fill: #B794FF; opacity: 0; animation: arm-accent-violet 26s ease-in-out -11s infinite; }

      @keyframes arm-pulse {
        0%, 100% { opacity: 0.44; }
        50% { opacity: 0.90; }
      }
      @keyframes arm-halo {
        0%, 100% { opacity: 0.08; transform: scale(0.85); }
        50% { opacity: 0.28; transform: scale(1.24); }
      }
      @keyframes arm-accent-ivory {
        0%, 24%, 76%, 100% { opacity: 0.72; }
        44%, 56% { opacity: 0.14; }
      }
      @keyframes arm-accent-ivory-halo {
        0%, 24%, 76%, 100% { opacity: 0.14; transform: scale(0.95); }
        44%, 56% { opacity: 0.03; transform: scale(0.82); }
      }
      @keyframes arm-accent-violet {
        0%, 24%, 76%, 100% { opacity: 0; }
        44%, 56% { opacity: 0.94; }
      }
      @keyframes arm-accent-violet-halo {
        0%, 24%, 76%, 100% { opacity: 0; transform: scale(0.82); }
        48% { opacity: 0.38; transform: scale(1.25); }
        58% { opacity: 0.24; transform: scale(1.06); }
      }
      @keyframes arm-accent-ring {
        0%, 34% { opacity: 0; transform: scale(0.6); }
        46% { opacity: 0.36; transform: scale(1.02); }
        62%, 100% { opacity: 0; transform: scale(1.42); }
      }
      @media (prefers-reduced-motion: reduce) {
        .p1-dot, .p1-halo, .p2-dot, .p2-halo, .p3-dot, .p3-halo,
        .p4-dot, .p4-halo, .p5-dot, .p5-halo, .p6-dot, .p6-halo,
        .accent-ivory-halo, .accent-ivory-dot,
        .accent-violet-ring, .accent-violet-halo, .accent-violet-dot {
          animation: none;
        }
        .accent-violet-ring { opacity: 0; }
        .accent-ivory-dot { opacity: 0.25; }
        .accent-ivory-halo { opacity: 0.06; }
        .accent-violet-dot { opacity: 0.82; }
        .accent-violet-halo { opacity: 0.24; }
      }
    </style>
  </defs>

