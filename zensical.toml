# Docs site for https://shadewrightlabs.com/armory/, built with Zensical.
# Local preview: make docs-venv && .venv/bin/zensical serve

[project]
site_name = "Armory"
site_description = "Shared Go building blocks for Shadewright Labs products."
site_url = "https://shadewrightlabs.com/armory/"
repo_url = "https://github.com/shadewright-labs/armory"
repo_name = "shadewright-labs/armory"
edit_uri = "edit/main/docs/"
copyright = "Copyright 2026 The Shadewright Labs Authors. Licensed under the Apache License 2.0."
extra_css = ["stylesheets/brand.css"]

nav = [
  { "Overview" = "index.md" },
  { "Packages" = [
    { "modelusage" = "packages/modelusage.md" },
  ] },
  { "Use it" = "use.md" },
  { "Design and decisions" = [
    { "Architecture decision records" = "adr/README.md" },
    { "ADR template" = "adr/0000-template.md" },
  ] },
  { "Contributing and CI" = [
    { "CI" = "ci.md" },
  ] },
  { "Shadewright docs" = "https://shadewright.io/" },
  { "Sablecourt docs" = "https://shadewrightlabs.com/sablecourt/" },
  { "Shadewright Labs" = "https://shadewrightlabs.com/" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/brand/armory-glyph.svg"
favicon = "assets/brand/armory-favicon.svg"
# false: no Google Fonts request; text and code use the system font stacks set in brand.css.
font = false
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Dark only: one palette, so the theme renders no toggle and ignores the reader's colour preference.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

# Zensical defaults set explicitly, with no Mermaid custom fence.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
